<div class="dog-detail-container">
  <div class="dog-profile-card">
    <div class="dog-header">
      <h1 class="dog-title">🐾 Detalle del Perro</h1>
    </div>

    <div class="dog-profile-content">
      <!-- Sección izquierda - Foto y datos principales -->
      <div class="profile-section">
        <div class="profile-photo-container">
          <img [src]="dogData.profilePhoto" alt="Foto de {{dogData.name}}" class="profile-image">
        </div>

        <div class="dog-info">
          <h2 class="dog-name">{{dogData.name}}</h2>
          
          <div class="info-item">
            <span class="info-label">Sexo:</span>
            <span class="info-value">{{dogData.sex}}</span>
          </div>
          
          <div class="info-item">
            <span class="info-label">Raza:</span>
            <span class="info-value">{{dogData.breed}}</span>
          </div>
          
          <div class="info-item">
            <span class="info-label">Dueño:</span>
            <span class="info-value">{{dogData.owner}}</span>
          </div>
          
          <div class="info-item">
            <span class="info-label">Dirección:</span>
            <span class="info-value">{{dogData.address}}</span>
          </div>
        </div>
      </div>

      <!-- Sección derecha - Galerías de fotos -->
      <div class="photos-section">
        <!-- Fotos Generales -->
        <div class="photos-group">
          <h3 class="photos-title">📸 Fotos Generales</h3>
          <div class="photos-grid">
            <div *ngFor="let photo of dogData.generalPhotos; let i = index" class="photo-item">
              <img [src]="photo" [alt]="'Foto general ' + (i+1)" (click)="openPhoto(photo)">
            </div>
          </div>
        </div>

        <!-- Fotos de Vacunas -->
        <div class="photos-group">
          <h3 class="photos-title">💉 Fotos de Vacunas</h3>
          <div class="photos-grid">
            <div *ngFor="let vaccine of dogData.vaccinePhotos; let i = index" class="photo-item">
              <img [src]="vaccine" [alt]="'Vacuna ' + (i+1)" (click)="openPhoto(vaccine)">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
