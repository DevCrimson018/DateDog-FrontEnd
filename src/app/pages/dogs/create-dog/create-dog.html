<div class="dog-register-container">
  <div class="dog-register-card">
    <div class="dog-header">
      <h1 class="dog-title">🐾 Registrar Nuevo Perro</h1>
      <p class="dog-subtitle">Completa la información de tu compañero canino</p>
    </div>

    <form [formGroup]="dogForm" (ngSubmit)="onSubmit()" class="dog-form">
      <!-- Sección Foto de Perfil -->
      <div class="form-section">
        <h2 class="section-title">📸 Foto de perfil</h2>
        
        <div class="profile-photo-container">
          <div class="profile-photo-preview">
            <img [src]="profileImage" alt="Foto de perfil actual" class="profile-image">
            <div class="file-upload-container">
              <label class="file-upload-label">
                <input type="file" (change)="onProfilePhotoSelected($event)" accept="image/*" style="display: none;">
                <span class="dog-button small">
                  <i class="icon">📷</i> Seleccionar
                </span>
              </label>
              <small class="file-info">{{ dogForm.get('profilePhoto')?.value?.name || 'Ningún archivo seleccionado' }}</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Sección Información Básica -->
      <div class="form-section">
        <h2 class="section-title">📝 Información Básica</h2>
        
        <div class="form-row">
          <div class="form-group">
            <label for="name" class="dog-label">
              <i class="icon dog-icon">🐕</i> Nombre del perro
            </label>
            <input type="text" id="name" formControlName="name" placeholder="Ej: Max" class="dog-input">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="sex" class="dog-label">
                <i class="icon dog-icon">♂️♀️</i> Sexo
              </label>
              <select id="sex" formControlName="sex" class="dog-input">
                <option value="" disabled selected>Seleccione</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
              </select>
            </div>

            <!-- Combo-Box of Breeds -->
          <app-breeds  [breeds]="breeds"></app-breeds>

            <div class="form-group">
              <label for="dateOfBirth" class="dog-label">
                <i class="icon dog-icon">🎂</i> dateOfBirth
              </label>
              <input type="date" id="dateOfBirth" formControlName="dateOfBirth" placeholder="En años humanos" class="dog-input">
            </div>
          </div>
        </div>
      </div>

      <!-- Sección Fotos Generales -->
      <div class="form-section">
        <h2 class="section-title">🖼️ Fotos generales (máx. 5)</h2>
        
        <div class="photos-container">
          <div class="photos-preview">
            <div *ngFor="let img of generalImages; let i = index" class="photo-thumbnail">
              <img [src]="img" alt="Foto general">
              <button type="button" class="remove-photo" (click)="removeImage(generalImages, i)">×</button>
            </div>
          </div>
          
          <label class="file-upload-label full-width">
            <input type="file" (change)="onGeneralPhotosSelected($event)" accept="image/*" multiple style="display: none;">
            <span class="dog-button small">
              <i class="icon">➕</i> {{ generalImages.length ? 'Añadir más' : 'Seleccionar fotos' }}
            </span>
            <small class="file-info">{{ generalImages.length }}/5 fotos seleccionadas</small>
          </label>
        </div>
      </div>

      <!-- Sección Fotos de Vacunas -->
      <div class="form-section">
        <h2 class="section-title">💉 Fotos de vacunas (máx. 5)</h2>
        
        <div class="photos-container">
          <div class="photos-preview">
            <div *ngFor="let img of vaccineImages; let i = index" class="photo-thumbnail">
              <img [src]="img" alt="Foto de vacuna">
              <button type="button" class="remove-photo" (click)="removeImage(vaccineImages, i)">×</button>
            </div>
          </div>
          
          <label class="file-upload-label full-width">
            <input type="file" (change)="onVaccinePhotosSelected($event)" accept="image/*" multiple style="display: none;">
            <span class="dog-button small">
              <i class="icon">➕</i> {{ vaccineImages.length ? 'Añadir más' : 'Seleccionar fotos' }}
            </span>
            <small class="file-info">{{ vaccineImages.length }}/5 fotos seleccionadas</small>
          </label>
        </div>
      </div>

       <!-- Sección de ubicación -->
      <div class="form-section" formGroupName="address">
        <h2 class="section-title">📍 Ubicación</h2>

        <app-countries  [countries]="countries" (sending)="getProvinces()"></app-countries>

        <div class="form-row">
          
          <app-provinces (sending)="getCities()" [provinces]="provinces"></app-provinces>

          <app-cities [cities]="cities"></app-cities>
        </div>

      </div>

      <button type="submit" class="dog-button" [disabled]="dogForm.invalid">
        <i class="icon">💾</i> Guardar
      </button>
    </form>
  </div>
</div>
