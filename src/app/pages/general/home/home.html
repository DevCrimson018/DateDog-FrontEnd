
<div class="nearby-dogs-container">

  <!-- Header -->
  <div class="header">
    <h1>🐕 Perros Cerca de Ti</h1>
    <p>Descubre compañeros caninos en tu área</p>
  </div>

  <!-- Controles de Vista -->
  <div class="view-controls">
    <button 
      [class.active]="!showMapView" 
      (click)="showMapView = false"
      class="view-btn"
    >
      📋 Lista
    </button>
    <button 
      [class.active]="showMapView" 
      (click)="showMapView = true"
      class="view-btn"
    >
      🗺️ Mapa
    </button>
  </div>

  <!-- Vista de Mapa -->
  @if(showMapView){
    <div class="map-view">
      <div class="map-placeholder">
        <div class="map-icon">🗺️</div>
        <h3>Vista de Mapa</h3>
        <p>Aquí se mostrarían los perros en un mapa interactivo</p>
        <small>✨ Próximamente con integración de Google Maps</small>
      </div>
    </div>
  }

  <!-- Vista de Lista -->
  @if(!showMapView){
    @if(loading){
      <app-loading [type]="'spinner'" [size]="'medium'"></app-loading>
    }@else {
      <div class="list-view">
        @for (dog of nearbyDogs; track $index) {
          <app-dogs-home [dog]="dog"></app-dogs-home>
        }
      </div>
    }
  }

 
</div>
