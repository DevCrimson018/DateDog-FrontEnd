<!-- login.component.html -->
<div class="dog-login-container">
  <div class="dog-login-card">
    <div class="dog-header">
      <div class="dog-ears">
        <div class="ear left-ear"></div>
        <div class="ear right-ear"></div>
      </div>
      <div class="dog-face">
        <div class="dog-eyes">
          <div class="eye left-eye"></div>
          <div class="eye right-eye"></div>
        </div>
        <div class="dog-nose"></div>
      </div>
    </div>
    
    <h1 class="dog-title">¡Guau! Identifícate</h1>
    <p class="dog-subtitle">Para acceder a tu cuenta canina</p>
    
    <form  [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="dog-form">
      <div class="form-group">
        <label for="credential" class="dog-label">
          <i class="icon dog-icon">🐶</i> Nombre de credential
        </label>
        <input 
          type="text" 
          id="credential" 
          formControlName="credential" 
          placeholder="Ej: Lucky, Max, Bella..." 
          class="dog-input"
        />
        <div *ngIf="loginForm.get('credential')?.invalid && loginForm.get('credential')?.touched" class="error-text">
          ¡Guau! Necesitamos saber cómo te llamas
        </div>
      </div>
      
      <div class="form-group">
        <label for="password" class="dog-label">
          <i class="icon dog-icon">🔒</i> Contraseña
        </label>
        <div class="password-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password" 
            placeholder="Tu hueso favorito" 
            class="dog-input"
          />
          <button type="button" (click)="togglePasswordVisibility()" class="toggle-password">
            <i class="iconn">{{ showPassword ? '🙈' : '👁️' }}</i>
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          ¡Al menos 6 caracteres, como un buen hueso!
        </div>
      </div>
      
      <button type="submit" class="dog-button" [disabled]="isLoading">
        <span *ngIf="!isLoading">¡Entrar! 🐕</span>
        <span *ngIf="isLoading">Buscando tu hueso... 🦴</span>
      </button>
      
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
    </form>
    
    <div class="dog-footer">
      <p>¿Olvidaste tu contraseña? <a routerLink="../forgot-password" class="dog-link">¡Recupérala aquí!</a></p>
      <p>¿No tienes cuenta? <a routerLink="../register" class="dog-link">¡Regístrate ahora!</a></p>
    </div>
  </div>
  
  <div class="dog-paw-decoration">
    <span>🐾</span>
    <span>🐾</span>
    <span>🐾</span>
    <span>🐾</span>
    <span>🐾</span>
    <span>🐾</span>
    <span>🐾</span>
    <span>🐾</span>
    <span>🐾</span>
  </div>
</div>
