<!-- register.component.html -->
<div class="dog-register-container">
  <div class="dog-register-card">
    <div class="dog-header">
      <div class="dog-paws">
        <span>🐾</span>
        <span>🐾</span>
        <span>🐾</span>
      </div>
      <h1 class="dog-title">¡Únete a la manada!</h1>
      <p class="dog-subtitle">Crea tu cuenta canina</p>
    </div>

    <form  (ngSubmit)="onSubmit()" class="dog-form">
      <!-- Sección de información personal -->
<div class="form-section personal-info-section">
  <h2 class="section-title">📝 Información Personal</h2>
  
  <div class="personal-info-container">
    <!-- Columna izquierda - Campos de formulario -->
    <div class="form-fields">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre" class="dog-label">
            <i class="icon dog-icon">🐕</i> Nombre
          </label>
          <input type="text" id="nombre" formControlName="nombre" placeholder="Ej: Usuario" class="dog-input">
        </div>

        <div class="form-group">
          <label for="apellido" class="dog-label">
            <i class="icon dog-icon">🏷️</i> Apellido
          </label>
          <input type="text" id="apellido" formControlName="apellido" placeholder="Ej: Apellido" class="dog-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email" class="dog-label">
            <i class="icon dog-icon">✉️</i> Email
          </label>
          <input type="email" id="email" formControlName="email" placeholder="Ej: lucky@huesos.com" class="dog-input">
        </div>

        <div class="form-group">
          <label for="edad" class="dog-label">
            <i class="icon dog-icon">🎂</i> Edad
          </label>
          <input type="number" id="edad" formControlName="edad" placeholder="En años humanos" class="dog-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="sexo" class="dog-label">
            <i class="icon dog-icon">♂️♀️</i> Sexo
          </label>
          <select id="sexo" formControlName="sexo" class="dog-input">
            <option value="" disabled selected>Selecciona</option>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Columna derecha - Foto de perfil -->
    <div class="profile-photo-column">
      <div class="profile-photo-container">
        <div class="profile-photo-preview">
          <img [src]="profileImage"  class="profile-image">
          <div class="profile-photo-actions">
            <label for="profilePhoto" class="dog-button small">
              <i class="icon">📷</i> {{selectedFile ? 'Cambiar' : 'Subir'}} foto
            </label>
            <input 
              type="file" 
              id="profilePhoto" 
              (change)="onFileSelected($event)" 
              accept="image/*" 
              style="display: none;"
            >
            <button 
              *ngIf="selectedFile" 
              type="button" 
              class="dog-button small danger" 
              (click)="removeProfileImage()"
            >
              <i class="icon">🗑️</i> Eliminar
            </button>
          </div>
        </div>
        <small class="photo-hint">¡Tu mejor ángulo canino!</small> 
      </div>
    </div>
  </div>
</div>

      <!-- Sección de credenciales -->
      <div class="form-section">
        <h2 class="section-title">🔐 Credenciales</h2>
        <div class="form-group">
          <label for="usuario" class="dog-label">
            <i class="icon dog-icon">🐶</i> Nombre de usuario
          </label>
          <input type="text" id="usuario" formControlName="usuario" placeholder="Ej: Lucky123" class="dog-input">
        </div>

        <div class="form-group">
          <label for="contrasena" class="dog-label">
            <i class="icon dog-icon">🔒</i> Contraseña
          </label>
          <div class="password-container">
            <input [type]="showPassword ? 'text' : 'password'" id="contrasena" formControlName="contrasena" 
                   placeholder="Tu hueso favorito" class="dog-input">
            <button type="button" (click)="togglePasswordVisibility()" class="toggle-password">
              <i class="icon">{{ showPassword ? '🙈' : '👁️' }}</i>
            </button>
          </div>
        </div>
      </div>

      <!-- Sección de ubicación -->
      <div class="form-section">
        <h2 class="section-title">📍 Ubicación</h2>
        <div class="form-group">
          <label for="pais" class="dog-label">
            <i class="icon dog-icon">🌎</i> País
          </label>
          <select id="pais" formControlName="pais" class="dog-input">
            <option value="" disabled selected>Selecciona tu país</option>
            <option *ngFor="let country of countries" [value]="country">{{country}}</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="provincia" class="dog-label">
              <i class="icon dog-icon">🏞️</i> Provincia/Estado
            </label>
            <select id="provincia" formControlName="provincia" class="dog-input" [disabled]="!registerForm.get('pais')?.value">
              <option value="" disabled selected>Selecciona primero tu país</option>
              <option *ngFor="let province of provinces" [value]="province">{{province}}</option>
            </select>
          </div>

          <div class="form-group">
            <label for="municipio" class="dog-label">
              <i class="icon dog-icon">🏘️</i> Municipio/Ciudad
            </label>
            <select id="municipio" formControlName="municipio" class="dog-input" 
                    [disabled]="!registerForm.get('provincia')?.value">
              <option value="" disabled selected>Selecciona primero tu provincia</option>
              <option *ngFor="let municipality of municipalities" [value]="municipality">{{municipality}}</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="ciudad" class="dog-label">
            <i class="icon dog-icon">🏡</i> Ciudad/Localidad
          </label>
          <input type="text" id="ciudad" formControlName="ciudad" placeholder="Tu ciudad exacta" class="dog-input">
        </div>
      </div>

      <button type="submit" class="dog-button" [disabled]="registerForm.invalid">
        ¡Unirme a la manada! 🐾
      </button>
    </form>

    <div class="dog-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/login" class="dog-link">¡Inicia sesión aquí!</a></p>
    </div>
  </div>
</div>
