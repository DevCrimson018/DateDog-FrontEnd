<div class="dog-register-container">
  <div class="dog-register-card">
    <div class="dog-header">
      <div class="dog-paws">
        <span>🐾</span>
        <span>🐾</span>
        <span>🐾</span>
      </div>
      <h1 class="dog-title">¡Únete a la manada!</h1>
      <p class="dog-subtitle">Crea tu cuenta canina</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="dog-form">
      <!-- Sección de información personal -->
      <div class="form-section personal-info-section">
        <h2 class="section-title">📝 Información Personal</h2>
        
        <div class="personal-info-container">
          <!-- Columna izquierda - Campos de formulario -->
          <div class="form-fields">
            <div class="form-row">
              <div class="form-group">
                <label for="firstName" class="dog-label">
                  <i class="icon dog-icon">🐕</i> Nombre
                </label>
                <input type="text" id="firstName" formControlName="firstName" placeholder="Ej: Lucky" class="dog-input">
              </div>

              <div class="form-group">
                <label for="lastName" class="dog-label">
                  <i class="icon dog-icon">🏷️</i> Apellido
                </label>
                <input type="text" id="lastName" formControlName="lastName" placeholder="Ej: Rodríguez" class="dog-input">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email" class="dog-label">
                  <i class="icon dog-icon">✉️</i> Email
                </label>
                <input type="email" id="email" formControlName="email" placeholder="Ej: lucky@huesos.com" class="dog-input">
              </div>

              <div class="form-group">
                <label for="dateOfBirth" class="dog-label">
                  <i class="icon dog-icon">🎂</i> Fecha de Nacimiento
                </label>
                <input type="date" id="dateOfBirth" formControlName="dateOfBirth" class="dog-input">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="sex" class="dog-label">
                  <i class="icon dog-icon">♂️♀️</i> Sexo
                </label>
                <select id="sex" formControlName="sex" class="dog-input">
                  <option value="" disabled selected>Selecciona</option>
                  <option value="M">Masculino</option>
                  <option value="F">Femenino</option>
                </select>
              </div>
            </div>

            <!-- NUEVA SECCIÓN: Redes Sociales -->
            <div class="form-row">
              <div class="form-group">
                <label for="" class="dog-label">
                  <i class="icon dog-icon">📱</i> WhatsApp
                </label>
                <input type="tel" id="whatsapp"
                       placeholder="Ej: +1 234 567 8900" class="dog-input">
              </div>

              <div class="form-group">
                <label for="" class="dog-label">
                  <i class="icon dog-icon">📸</i> Instagram
                </label>
                <input type="text" id="instagram"
                       placeholder="Ej: @tu_usuario" class="dog-input">
              </div> 
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="" class="dog-label">
                  <i class="icon dog-icon">👥</i> Facebook
                </label>
                <input type="text" id="facebook"
                       placeholder="Ej: facebook.com/tu_usuario" class="dog-input">
              </div>
            </div>
          </div>

          <!-- Columna derecha - Foto de perfil -->
          <div class="profile-photo-column">
            <div class="profile-photo-container">
              <div class="profile-photo-preview">
                <img [src]="profileImage" class="profile-image">
              </div>
              <div class="profile-photo-actions">
                <label for="profilePhoto" class="dog-button small">
                  <i class="icon">📷</i> {{selectedFile ? 'Cambiar' : 'Subir'}} foto
                </label>
                <input 
                  type="file" 
                  id="profilePhoto" 
                  accept="image/*" 
                  style="display: none;"
                >
                <button 
                  *ngIf="selectedFile" 
                  type="button" 
                  class="dog-button small danger" 
                >
                  <i class="icon">🗑️</i> Eliminar
                </button>
              </div>
              <small class="photo-hint">¡Tu mejor ángulo canino!</small> 
            </div>
          </div>
        </div>
      </div>

      <!-- Sección de credenciales -->
      <div class="form-section">
        <h2 class="section-title">🔐 Credenciales</h2>
        <div class="form-group">
          <label for="username" class="dog-label">
            <i class="icon dog-icon">🐶</i> Nombre de usuario
          </label>
          <input type="text" id="username" formControlName="username" placeholder="Ej: Lucky123" class="dog-input">
        </div>

        <div class="form-group">
          <label for="password" class="dog-label">
            <i class="icon dog-icon">🔒</i> Contraseña
          </label>
          <div class="password-container">
            <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" 
                   placeholder="Tu hueso favorito" class="dog-input">
            <button type="button" (click)="togglePasswordVisibility()" class="toggle-password">
              <i class="icon">{{ showPassword ? '🙈' : '👁️' }}</i>
            </button>
          </div>
        </div>
      </div>

      <!-- Sección de ubicación -->
      <div class="form-section" formGroupName="address">
        <h2 class="section-title">📍 Ubicación</h2>

        <app-countries [countries]="countries" (sending)="getProvinces()" [loading]="loading"></app-countries>

        <div class="form-row">
          <app-provinces (sending)="getCities()" [provinces]="provinces" [loading]="loading"></app-provinces>
          <app-cities [cities]="cities" [loading]="loading"></app-cities>
        </div>
      </div>

      @if(loading){
        <app-loading [size]="'small'"></app-loading>
      }@else {
        <button type="submit" class="dog-button">
          ¡Unirme a la manada! 🐾
        </button>
      }
    </form>

    <div class="dog-footer">
      <p>¿Ya tienes cuenta? <a routerLink="../login" class="dog-link">¡Inicia sesión aquí!</a></p>
    </div>
  </div>
</div>
