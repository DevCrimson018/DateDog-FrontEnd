<div class="loading-container" [class]="size">
  <div class="loading-content" [class]="type">
    
    <!-- Tipo: Huesos Bailarines -->
    <div *ngIf="type === 'bones'" class="bones-loader">
      <div class="bone bone-1">🦴</div>
      <div class="bone bone-2">🦴</div>
      <div class="bone bone-3">🦴</div>
    </div>

    <!-- Tipo: Perro Corriendo -->
    <div *ngIf="type === 'dog-running'" class="dog-running-loader">
      <div class="dog-track">
        <div class="running-dog">🐕</div>
        <div class="paw-prints">
          <span class="paw">🐾</span>
          <span class="paw">🐾</span>
          <span class="paw">🐾</span>
        </div>
      </div>
    </div>

    <!-- Tipo: Spinner Clásico -->
    <div *ngIf="type === 'spinner'" class="spinner-loader">
      <div class="spinner"></div>
    </div>

    <!-- Tipo: Simple -->
    <div *ngIf="type === 'simple'" class="simple-loader">
      <div class="simple-dog">🐶</div>
    </div>

    <!-- Mensaje -->
    <p class="loading-message">{{message}}</p>
    
    <!-- Texto adicional divertido -->
    <p class="loading-subtext" *ngIf="type !== 'simple'">
      <!-- {{getRandomLoadingText()}} -->
    </p>
  </div>
</div>
