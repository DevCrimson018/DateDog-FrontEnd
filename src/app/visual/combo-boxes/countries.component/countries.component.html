<div class="form-group" formGroupName="address">

  <label for="countryId" class="dog-label">
    <i class="icon dog-icon">🌎</i> País
  </label>
  <select id="countryId" formControlName="countryId" class="dog-input" (change)="getProvinces()">
    @if(loading){
      <option value="" disabled selected>
        <app-loading [size]="'extraSmall'" [type]="'spinner'"></app-loading>
      </option>
    }@else{
      <option value="" disabled selected>Selecciona tu país</option>
      @for (country of countries; track $index) {
          <option [value]="country._id">{{country.name}}</option>
      }
    }  
  </select>
  

</div>
