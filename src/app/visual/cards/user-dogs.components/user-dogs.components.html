<div class="dog-card">
    <div class="dog-card-header">
    <img [src]="dog.profilePhoto" [alt]="dog.name" class="dog-card-image">
    <div class="dog-card-info">
      <h3 class="dog-card-name">{{dog.name}}</h3>
      <p class="dog-card-breed">
        {{dog.breed}} 
        <span class="sex-symbol">{{getSexSymbol(dog.sex)}}</span>
        {{getSexLabel(dog.sex)}}
      </p>
      <p class="dog-card-age">🎂 {{getAge(dog.dateOfBirth)}}</p>
    </div>
  </div>
  
  <div class="dog-card-actions">
    <button class="dog-button small" [routerLink]="'/dogs/dog-details/' + dog._id">
      <i class="icon">👀</i> Ver Detalles
    </button>
    
    @if(isSameUser == true){
      <button class="dog-button small secondary" [routerLink]="'/dogs/edit-dog/' + dog._id">
        <i class="icon">✏️</i> Editar
      </button>
    }

  </div>
</div>
